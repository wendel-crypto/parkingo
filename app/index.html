:root{
  --bg:#0F0724;--s1:#1A0F3A;--s2:#25164F;--line:rgba(255,255,255,.11);--ink:#FFF6FB;--mut:#BBABDD;--dim:#8474AD;
  --pink:#FF2E97;--orange:#FF8A3D;--cyan:#1BE7FF;--teal:#00E5C3;--violet:#8B5CFF;--yellow:#FFD23F;--err:#FF6B81;
  --sunset:linear-gradient(135deg,#FF2E97,#FF8A3D);--ocean:linear-gradient(135deg,#1BE7FF,#8B5CFF);--dusk:linear-gradient(160deg,#3B1A7A,#B4237F 60%,#FF7A3D)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--ink);font:400 15px/1.3 Outfit,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}.script{font-family:Yellowtail,cursive;font-weight:400}
.phone{position:fixed;inset:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.status,.home{display:none}
@media(min-width:560px){
  body:not(.embed):not(.bare){display:flex;align-items:center;justify-content:center;background:radial-gradient(800px 500px at 20% 100%,#FF2E97 0,transparent 60%),radial-gradient(900px 600px at 85% 0,#1BE7FF 0,transparent 55%),#0F0724}
  body:not(.embed):not(.bare) .phone{position:relative;inset:auto;width:390px;height:min(844px,calc(100vh - 32px));border-radius:48px;box-shadow:0 0 0 10px #090314,0 0 0 11px #4A2C8F,0 0 60px rgba(255,46,151,.35)}
  body:not(.embed):not(.bare) .status{display:flex}body:not(.embed):not(.bare) .home{display:block}
  body:not(.embed):not(.bare) .phone{--st:38px;--hb:14px}
}
body.bare .status{display:flex}body.bare .home{display:block}body.bare .phone{--st:38px;--hb:14px}
.status{position:absolute;top:0;left:0;right:0;z-index:30;height:44px;justify-content:space-between;align-items:center;padding:6px 27px 0;font-weight:600;font-size:15px;pointer-events:none}
.home{position:absolute;left:50%;bottom:8px;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#fff;opacity:.85;z-index:60;pointer-events:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:var(--st,0px);animation:fade .25s ease both}
.view.full{padding-top:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
.hd{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
.hd .bk{width:42px;height:42px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.hd .tt{font-weight:600;font-size:17px;flex:1}
.body{flex:1;min-height:0;overflow:auto;padding:8px 20px 20px;-webkit-overflow-scrolling:touch}
.foot{padding:12px 20px calc(18px + var(--hb,0px));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,var(--bg) 30%)}
.neon{font-weight:800;font-size:31px;line-height:1.08;letter-spacing:-.01em;margin:10px 0 6px;text-shadow:0 0 22px rgba(255,46,151,.55)}
.sub{color:var(--mut);margin:0 0 16px;font-size:15px;line-height:1.4}
h3{margin:18px 0 10px;font-size:16px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:18px;font-weight:700;font-size:16px;background:var(--sunset);color:#fff;box-shadow:0 8px 26px rgba(255,46,151,.35);text-align:center;width:100%}
.btn:active{transform:scale(.98)}.btn.ghost{background:transparent;border:1.5px solid rgba(27,231,255,.55);color:var(--cyan);box-shadow:none}
.btn.txt{background:none;box-shadow:none;color:var(--cyan);min-height:40px}.btn[disabled]{opacity:.45;box-shadow:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.mut{color:var(--mut)}.dim{color:var(--dim)}.sm{font-size:13px}.b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.08em;background:rgba(27,231,255,.13);color:var(--cyan);border:1px solid rgba(27,231,255,.3)}
.chip.ok{background:rgba(0,229,195,.13);color:var(--teal);border-color:rgba(0,229,195,.3)}.chip.pk{background:rgba(255,46,151,.14);color:#FF7FBF;border-color:rgba(255,46,151,.35)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(27,231,255,.09);border:1px solid rgba(27,231,255,.22);color:#CFF8FF;font-size:13.5px;line-height:1.35}
.note svg{color:var(--cyan);margin-top:1px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--sunset);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,46,151,.5);font-style:normal;font-weight:800;color:#fff}
.logo b{font-family:Yellowtail,cursive;font-weight:400;font-size:28px;text-shadow:0 0 14px rgba(255,46,151,.6)}
.hero{position:relative;border-radius:26px;overflow:hidden;background:var(--dusk) center/cover;min-height:230px;display:flex;align-items:flex-end;border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(15,7,36,.92))}
.hero>div{position:relative;z-index:1;padding:16px 18px}
.hero small{display:block;color:var(--teal);font-weight:700;letter-spacing:.12em;font-size:11px}
.hero strong{font-size:26px;font-weight:800;text-shadow:0 0 18px rgba(255,46,151,.6)}
.field{display:block;padding:10px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:2px}
.field div{font-weight:600;font-size:16px}
.plate{background:#fff;color:#1a1033;border-radius:18px;padding:12px 18px 14px;border:3px solid #1a1033;position:relative;text-align:center}
.plate small{display:block;font-weight:700;letter-spacing:.2em;font-size:11px;color:#C21B6D}
.plate b{font-size:42px;font-weight:800;letter-spacing:.14em;line-height:1.1}
.plate span{display:block;font-size:11px;color:#6a5b8e;letter-spacing:.08em}
.pay{border-radius:22px;padding:18px;background:var(--dusk);position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(180,35,127,.35)}
.pay .n{font-size:22px;letter-spacing:.14em;margin:22px 0 14px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;overflow:hidden;background:var(--s1);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column}
.tile[aria-pressed=true],.opt[aria-pressed=true]{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(27,231,255,.25),0 0 22px rgba(27,231,255,.25)}
.tile .im{height:104px;display:block;background:#1a0f3a center/cover no-repeat}
.tile .im svg{width:78px;height:50px;fill:none;stroke:currentColor;stroke-width:2;filter:drop-shadow(0 0 8px currentColor)}
.tile .tx{padding:10px 12px 12px}.tile b{display:block}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);width:100%}
.ico.th{width:52px;height:52px;border-radius:14px;background:#1a0f3a center/cover no-repeat}
.ico{width:42px;height:42px;border-radius:13px;background:rgba(27,231,255,.12);color:var(--cyan);display:grid;place-items:center;flex:none}
.ico.pk{background:rgba(255,46,151,.16);color:#FF7FBF}
.item .g{flex:1;min-width:0}.item .g b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-weight:800;color:var(--teal);white-space:nowrap}
.heart{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;color:var(--dim)}.heart.on{color:var(--pink)}.heart.on svg{fill:var(--pink)}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:8px}
.fc{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-weight:600;font-size:13.5px;white-space:nowrap}
.fc[aria-pressed=true]{background:var(--sunset);border-color:transparent}
.map{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#150a33}
.map svg{display:block;width:100%;height:auto}
.map .tag{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.1em;padding:4px 9px;border-radius:99px;background:rgba(15,7,36,.7);color:var(--cyan);border:1px solid rgba(27,231,255,.3)}
.pin{cursor:pointer}
.tabs{display:flex;justify-content:space-around;padding:8px 14px calc(8px + var(--hb,0px));background:rgba(26,15,58,.88);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--dim);padding:6px 18px;border-radius:16px}
.tabs button[aria-current=page]{color:var(--cyan);background:rgba(27,231,255,.12)}
.dark{background:linear-gradient(135deg,#1a0f3a,#0e5a72);border-radius:22px;padding:18px;border:1px solid var(--line);position:relative;overflow:hidden}
.dark .k{color:var(--teal);font-weight:700;letter-spacing:.12em;font-size:11px}
.dark .big{font-size:30px;font-weight:800;margin-top:4px}
.opt{border-radius:18px;padding:16px;text-align:center;background:rgba(27,231,255,.1);border:1.5px solid rgba(27,231,255,.25);font-weight:800;font-size:20px}
.opt small{display:block;font-size:12.5px;color:var(--cyan);font-weight:500;margin-top:2px}
.opt[disabled]{opacity:.35}
.kv{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv span:first-child{color:var(--mut)}
.stars{display:flex;gap:8px}.stars button{flex:1;height:52px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--yellow)}
.stars button.on svg{fill:var(--yellow)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--dim)}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--ocean);min-height:3px;opacity:.75}.bars .hi i{background:var(--sunset);opacity:1}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;padding:11px 0;text-align:center;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-weight:600}
.seg button[aria-pressed=true]{background:var(--sunset);border-color:transparent}
.turn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--dusk);margin-bottom:12px;width:100%;box-shadow:0 10px 28px rgba(180,35,127,.35)}
.qr{background:#fff;border-radius:18px;padding:14px;width:210px;margin:0 auto}.qr svg{display:block;width:100%;height:auto}
.timer{font-size:44px;font-weight:800;text-align:center;letter-spacing:.02em;text-shadow:0 0 22px rgba(27,231,255,.6)}
.sheet{position:absolute;inset:0;z-index:50;background:rgba(8,3,22,.7);display:flex;align-items:flex-end;animation:fade .2s both}
.sheet>div{width:100%;background:var(--s1);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:20px 20px calc(22px + var(--hb,0px));max-height:82%;overflow:auto}
.big-bay{font-size:64px;font-weight:800;text-align:center;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.prog{height:8px;border-radius:99px;background:var(--s2);overflow:hidden}.prog i{display:block;height:100%;background:var(--ocean);transition:width .4s}
.toast{position:absolute;left:20px;right:20px;bottom:calc(96px + var(--hb,0px));z-index:70;padding:13px 16px;border-radius:16px;background:#0e2f3a;border:1px solid rgba(27,231,255,.5);color:#CFF8FF;font-weight:600;animation:fade .2s both;text-align:center}
.lg{display:flex;gap:8px}.lg button{flex:1;padding:10px 0;border-radius:12px;text-align:center;border:1px solid var(--line);background:var(--s1);font-weight:700}.lg button[aria-pressed=true]{background:var(--ocean);color:#0F0724;border-color:transparent}
.avatar{width:96px;height:96px;border-radius:28px;background:var(--ph-maria) center 22%/cover no-repeat;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 30px rgba(255,46,151,.5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

const blocks=(()=>{let o='';for(let x=6;x<236;x+=46)for(let y=6;y<290;y+=40){if((x>150&&y>190&&x<240)||(x>=190&&y<80&&false))continue;o+=`<rect x="${x}" y="${y}" width="36" height="30" rx="5"/>`}return o})();
function mapSvg(o={}){
 const path=o.route?routePts(o.route):null;
 let pins='';
 if(o.pins)for(const s of SP){const sel=o.sel===s.id;const lab=money(s.r).replace(/\.00$/,'');const w=sel?58:48;
  pins+=`<g class="pin" data-a="spot" data-v="${s.id}" role="button" aria-label="${s.n}"><rect x="${s.x-w/2}" y="${s.y-13}" width="${w}" height="26" rx="13" fill="${sel?'#1BE7FF':'url(#gs)'}" stroke="#fff" stroke-opacity=".5"/><text x="${s.x}" y="${s.y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="${sel?'#0F0724':'#fff'}" font-family="Outfit,sans-serif">${lab}</text></g>`}
 let rt='';
 if(path){const d='M'+path.map(p=>p.join(' ')).join('L');const s=spot(o.route);
  rt=`<path d="${d}" fill="none" stroke="#1BE7FF" stroke-width="9" stroke-opacity=".25" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#1BE7FF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${o.dash?'1 9':'none'}"/><g><rect x="${s.x-13}" y="${s.y-13}" width="26" height="26" rx="8" fill="#FF2E97" stroke="#fff"/><text x="${s.x}" y="${s.y+6}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" font-family="Outfit">P</text></g>`;
  const pt=pointAt(path,o.p??0);rt+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="14" fill="#FFD23F" fill-opacity=".25"/><circle cx="${pt[0]}" cy="${pt[1]}" r="7" fill="#FFD23F" stroke="#0F0724" stroke-width="2.5"/>`}
 else if(o.you!==false)rt=`<circle cx="${YOU.x}" cy="${YOU.y}" r="14" fill="#FFD23F" fill-opacity=".25"/><circle cx="${YOU.x}" cy="${YOU.y}" r="7" fill="#FFD23F" stroke="#0F0724" stroke-width="2.5"/>`;
 return `<div class="map"><span class="tag">${T('demo')} MAP</span><svg viewBox="0 0 360 290" role="img" aria-label="Illustrative map of Miami and Miami Beach"><defs><linearGradient id="bw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3a6e"/><stop offset="1" stop-color="#2b1a7a"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2E97"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient></defs>
 <rect width="360" height="290" fill="#1b0f3f"/><g fill="#2a1963" stroke="#3b2788" stroke-width="1">${blocks}</g>
 <path d="M244 0C262 60 232 100 258 150S270 250 300 290H236C214 240 222 190 200 150S226 60 214 0z" fill="url(#bw)" opacity=".0"/>
 <path d="M240 0c10 40 4 80 24 120s6 110 30 170H360V0z" fill="url(#bw)"/><path d="M296 0c4 50-6 90 14 140s2 110 26 150H360V0z" fill="#23135a" stroke="#FF2E97" stroke-opacity=".35"/>
 <path d="M248 122 300 128M258 220 304 226" stroke="#8B5CFF" stroke-width="5" stroke-linecap="round" opacity=".7"/>
 <text x="262" y="196" font-size="9" font-weight="700" fill="#7fd9ff" opacity=".85" letter-spacing="2" font-family="Outfit">BISCAYNE BAY</text>
 <text x="12" y="282" font-size="9" font-weight="700" fill="#BBABDD" opacity=".7" letter-spacing="1.5" font-family="Outfit">DOWNTOWN · BRICKELL</text>${rt}${pins}</svg></div>`}
function routePts(id){const s=spot(id);const a=YOU,b=s;const mx=a.x+(b.x-a.x)*.4,my=a.y+(b.y-a.y)*.55;return[[a.x,a.y],[a.x,my],[mx,my],[mx,b.y+(b.y<a.y?18:-18)],[b.x,b.y+(b.y<a.y?18:-18)],[b.x,b.y]].filter((p,i,arr)=>!i||p[0]!==arr[i-1][0]||p[1]!==arr[i-1][1])}
function pointAt(p,f){const seg=[];let tot=0;for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);seg.push(l);tot+=l}let d=tot*Math.min(1,Math.max(0,f));for(let i=0;i<seg.length;i++){if(d<=seg[i]||i===seg.length-1){const k=seg[i]?Math.min(1,d/seg[i]):1;return[p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k]}d-=seg[i]}return p[p.length-1]}

search:()=>{const ql=S.q.trim().toLowerCase();const list=SP.filter(s=>(!ql||s.n.toLowerCase().includes(ql))&&(S.flt==='all'||(S.flt==='fav'&&S.fav.includes(s.id))||(S.flt==='cov'&&s.cov)||(S.flt==='ev'&&s.ev))).sort((a,b)=>a.d-b.d);
 return {html:`${hdr(T('srN'))}<div class="body"><div class="neon">${T('srT')}</div><p class="sub">${t('srS',SP.length)}</p><label class="search">${ic('search')}<input id="q" value="${S.q.replace(/"/g,'&quot;')}" placeholder="${T('searchPh')}" aria-label="${T('searchPh')}" autocomplete="off"></label><div class="chips">${[['all','fAll'],['fav','fFav'],['cov','fCov'],['ev','fEv']].map(([k,l])=>`<button class="fc" data-a="flt" data-v="${k}" aria-pressed="${S.flt===k}">${T(l)}</button>`).join('')}</div>${mapSvg({pins:1})}<h3>${T('avail')}</h3><div class="list" id="res">${list.map(spotRow).join('')||`<p class="mut">${T('none')}</p>`}</div></div>`}},
spot:()=>{const s=spot(S.spot),open=isOpen(s);return {html:`${hdr(T('sdN'))}<div class="body"><div class="hero" style="background-image:var(--ph-${s.ph});min-height:210px"></div><div class="row sp" style="margin-top:14px"><span class="chip ${open?'ok':'pk'}">${open?T('openD'):T('closedD')}</span><button class="heart ${S.fav.includes(s.id)?'on':''}" data-a="fav" data-v="${s.id}" aria-label="Favorite" aria-pressed="${S.fav.includes(s.id)}">${ic('heart')}</button></div><div class="neon" style="font-size:27px;margin-top:6px">${s.n}</div><div class="row sp"><span class="mut">${t('away',s.d)} · ${t('bays',s.free)}</span><span class="price" style="font-size:18px">${money(s.r)} ${t('hr')}</span></div><div class="card" style="margin-top:16px"><b>${T('incl')}</b><div class="col" style="margin-top:10px;gap:8px"><span class="row">${ic('check')}${T('i1')}</span><span class="row">${ic('check')}${T('i2')}</span>${s.cov?`<span class="row">${ic('roof')}${T('iCov')}</span>`:''}${s.ev?`<span class="row">${ic('bolt')}${T('iEv')}</span>`:''}<span class="row">${ic('clock')}${hoursTxt(s)}</span></div></div></div>${foot(btn(T('chooseBay'),'bays'))}`}},
bay:()=>{const s=spot(S.spot);return {html:`${hdr(T('bayN'))}<div class="body"><div class="neon">${T('bayT')}</div><p class="sub">${T('bayS')}</p><div class="item"><span class="ico">${ic('p')}</span><span class="g"><b>${s.n}</b><span class="price">${money(s.r)} ${t('hr')}</span></span></div><div class="grid2" style="margin:14px 0">${s.bays.map((b,i)=>`<button class="opt" data-a="pickbay" data-v="${b}" aria-pressed="${S.bay===b}" ${i===3&&s.bays.length>4?'disabled':''}>${b}<small>${i===3&&s.bays.length>4?T('taken'):T('avl')}</small></button>`).join('')}</div><div class="card"><div class="kv"><span>${T('selBay')}</span><b>${S.bay}</b></div><div class="kv"><span>${T('sub')}</span><b>${money(s.r)}</b></div></div><div style="height:12px"></div>${note('clock',T('bayNote'))}</div>${foot(btn(T('reserve'),'reserve'))}`}},
route:()=>{const s=spot(S.spot);return {html:`${hdr(T('roN'))}<div class="body"><div class="neon">${T('roT')}</div><p class="sub">${T('roS')}</p>${mapSvg({route:s.id})}<div class="col" style="margin-top:16px;gap:14px"><div class="row"><span class="ico">${ic('pin')}</span><div><b>${T('yourLoc')}</b><div class="sm mut">${T('yourLocV')}</div></div></div><div class="row"><span class="ico">${ic('turn')}</span><div><b>${T('follow')}</b><div class="sm mut">${T('followS')} · ${mins(s)} ${T('min')}</div></div></div><div class="row"><span class="ico pk">${ic('p')}</span><div><b>${s.n}</b><div class="sm mut">${T('resBay')} ${S.bay}</div></div></div></div></div>${foot(btn(T('startD'),'go','drive'))}`}},
drive:()=>{const s=spot(S.spot),st=[['t1',200],['t2',450],['t3',60]][S.step%3];return {html:`${hdr(T('drN'))}<div class="body"><button class="turn" data-a="step">${ic('turn')}<span style="flex:1"><b style="font-size:20px;display:block">${T(st[0])}</b><span class="sm" style="opacity:.9">${t('in',st[1])} · ${T('nextStep')}</span></span></button>${mapSvg({route:s.id,p:.12+S.step*.1})}<div class="item" style="margin-top:12px">${ic('pin','')}<span class="g mut">${T('dest')}</span><b>${s.n}</b></div></div>${foot(btn(T('viewTrip'),'go','trip'))}`}},
trip:()=>{const s=spot(S.spot);return {html:`${hdr(T('tpN'))}<div class="body"><div class="neon">${T('tpT')}</div><p class="sub">${T('tpS')}</p><div id="tmap">${mapSvg({route:s.id,p:S.prog})}</div><div class="prog" style="margin:14px 0"><i id="pbar" style="width:${S.prog*100}%"></i></div><div class="item"><span class="g mut">${T('dest')}</span><b>${s.n}</b></div><div class="item" style="margin-top:10px">${ic('clock')}<span class="g mut">${T('eta')}</span><b class="num" id="etaT">${eta(Math.max(1,Math.round(mins(s)*(1-S.prog))))}</b></div></div>${foot(btn(T('arrived'),'go','arrive'))}`}},
arrive:()=>{const s=spot(S.spot);return {html:`${hdr(T('arN'))}<div class="body"><div class="neon">${t('arT',s.n)}</div><p class="sub">${T('arS')}</p>${mapSvg({route:s.id,p:1})}<div class="card" style="margin-top:14px"><div class="row"><span class="ico">${ic('p')}</span><div><b>${s.n}</b><div class="sm mut">${T('resv')}</div></div></div><div class="big-bay" style="margin-top:10px">${S.bay}</div></div></div>${foot(btn(T('toCheck'),'go','checkin'))}`}},

 const lbl={today:'today',week:'week',month:'month'}[R];
 return {html:`${hdr(T('stN'))}<div class="body"><div class="neon">${T('stT')}</div><p class="sub">${T('stS')}</p><div class="seg" role="group">${['today','week','month'].map(k=>`<button data-a="range" data-v="${k}" aria-pressed="${R===k}">${T(k)}</button>`).join('')}</div><div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:10px">${[[items.length,'visits'],[money(sp),'spent'],[mn>=60?`${(mn/60).toFixed(1)} h`:`${mn} ${T('min')}`,'parked']].map(([v,l])=>`<div class="card" style="padding:12px 10px"><b class="num" style="font-size:19px;display:block">${v}</b><span class="sm mut">${T(l)}</span></div>`).join('')}</div><div class="seg" style="margin:14px 0 10px">${[['chart','chart'],['table','table']].map(([k,i])=>`<button data-a="mode" data-v="${k}" aria-pressed="${S.mode===k}"><span class="row" style="justify-content:center;gap:6px">${ic(i)}${T(k)}</span></button>`).join('')}</div><div class="card"><b>${T('spend')}</b>${S.mode==='chart'?`<div class="bars" role="img" aria-label="${T('spend')}">${rows.map((r,i)=>`<div class="${i===hiI&&r[1]>0?'hi':''}"><i style="height:${Math.max(3,r[1]/mx*100)}%"></i><span>${r[0]}</span></div>`).join('')||`<p class="mut">—</p>`}</div>`:`<div style="margin-top:6px">${rows.map(r=>`<div class="kv"><span>${r[0]}</span><span class="num">${r[2]} ${T('min')} · <b style="color:var(--ink)">${money(r[1])}</b></span></div>`).join('')||`<p class="mut">—</p>`}</div>`}</div></div>${foot(btn(T('back'),'tab','activity','txt'))}`}},
profile:()=>({tab:'profile',full:1,html:`<div class="body" style="padding-top:calc(var(--st,0px) + 14px)"><div class="row" style="gap:16px"><div class="avatar" role="img" aria-label="Maria Snow"></div><div><div class="neon" style="font-size:28px;margin:0">Maria Snow</div><div class="mut">${T('prSub')}</div></div></div><div class="list" style="margin-top:20px"><button class="item" data-a="go" data-v="vehicle"><span class="ico">${ic('car')}</span><span class="g"><b>${T('prV')}</b><span class="sm mut">${T('prVs')}</span></span>${ic('chev')}</button><button class="item" data-a="go" data-v="pay"><span class="ico">${ic('card')}</span><span class="g"><b>${T('prP')}</b><span class="sm mut">${T('prPs')}</span></span>${ic('chev')}</button><button class="item" data-a="go" data-v="stats"><span class="ico">${ic('chart')}</span><span class="g"><b>${T('prS')}</b><span class="sm mut">${T('prSs')}</span></span>${ic('chev')}</button><button class="item" data-a="go" data-v="search"><span class="ico pk">${ic('heart')}</span><span class="g"><b>${T('prF')}</b><span class="sm mut">${t('prFs',S.fav.length)}</span></span>${ic('chev')}</button></div><h3>${T('lang')}</h3><div class="lg">${['en','es','pt'].map(k=>`<button data-a="lang" data-v="${k}" aria-pressed="${S.lang===k}">${k.toUpperCase()}</button>`).join('')}</div><button class="btn txt" data-a="restart" style="margin-top:14px">${T('signOut')}</button><p class="sm dim" style="text-align:center">${T('ph')}</p></div>${tabs('profile')}`})
};
/* ---------- render ---------- */
let timer;
function render(anim=true){
 document.documentElement.lang=S.lang;clearInterval(timer);
 const sc=view.querySelector('.body'),pos=sc?sc.scrollTop:0,f=SC[S.scr]();
 view.className='view'+(f.full?' full':'');if(!anim)view.style.animation='none';else view.style.animation='';
 view.innerHTML=f.html;const b=view.querySelector('.body');if(b&&!anim)b.scrollTop=pos;
 const qi=$('#q');if(qi&&S.focusQ){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
 document.title=`Parkin’go · ${S.scr}`;
 if(S.scr==='trip'){timer=setInterval(()=>{S.prog=Math.min(1,S.prog+.02);const s=spot(S.spot);const tm=$('#tmap');if(tm)tm.innerHTML=mapSvg({route:s.id,p:S.prog});const pb=$('#pbar');if(pb)pb.style.width=S.prog*100+'%';const e=$('#etaT');if(e)e.textContent=eta(Math.max(1,Math.round(mins(s)*(1-S.prog))));if(S.prog>=1)clearInterval(timer)},400)}
 if(S.sess)timer=timer||setInterval(()=>{},1e9);
 if(S.sess&&S.scr!=='trip'){clearInterval(timer);timer=setInterval(()=>{document.querySelectorAll('[data-live]').forEach(e=>e.textContent=mmss(left()));const lb=$('#lbar');if(lb)lb.style.width=(100-left()/LIVE_DUR()*100)+'%'},1000)}
 try{parent.postMessage({mr:'screen',v:S.scr},'*')}catch(e){}
}
const TABS=['home','activity','profile'];
function go(s){if(!SC[s])return;if(TABS.includes(S.scr)||s===S.scr){}else S.stack.push(S.scr);if(TABS.includes(s))S.stack=[];S.scr=s;if(s==='trip'&&S.prog>=1)S.prog=0;render(true)}
function toast(m){const old=$('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;$('#phone').appendChild(d);setTimeout(()=>d.remove(),1900)}
function act(a,v){switch(a){
 case 'go':go(v);break;
 case 'back':S.scr=S.stack.pop()||'home';render(true);break;
 case 'tab':S.stack=[];S.scr=v;render(true);break;
 case 'start':S.stack=[];S.scr='home';render(true);break;
 case 'veh':S.veh=v;render(false);break;
 case 'spot':S.spot=v;S.bay=spot(v).bays[0];S.ext=0;S.stack=S.scr==='spot'?S.stack:[...S.stack,S.scr];S.scr='spot';render(true);break;
 case 'fav':{const i=S.fav.indexOf(v);i<0?S.fav.push(v):S.fav.splice(i,1);render(false);toast(i<0?t('faved'):t('unfaved'));break}
 case 'flt':S.flt=v;S.focusQ=0;render(false);break;
 case 'bays':if(!isOpen(spot(S.spot)))return toast(t('isClosed'));go('bay');break;
 case 'pickbay':S.bay=v;render(false);break;
 case 'reserve':S.prog=0;S.step=0;go('route');break;
 case 'step':S.step++;render(false);break;
 case 'checkin':{S.sess={s:S.spot,bay:S.bay,t0:Date.now(),ext:0};S.rate=0;S.scr='session';S.stack=[];render(true);break}
 case 'add':S.add=+v;render(false);break;
 case 'extend':if(S.sess)S.sess.ext+=S.add;S.scr='session';S.stack=[];render(true);toast(t('exDone'));break;
 case 'rate':S.rate=+v;render(false);break;
 case 'end':{if(S.sess){const s=spot(S.sess.s),m=60+S.sess.ext;S.hist.unshift({id:S.hist.length+10,s:S.sess.s,d:0,m,a:s.r*m/60});S.sess=null}S.scr='done';S.stack=[];render(true);break}
 case 'rc':S.rc=+v;go('receipt');break;
 case 'range':S.range=v;render(false);break;
 case 'mode':S.mode=v;render(false);break;
 case 'lang':S.lang=v;render(false);try{parent.postMessage({mr:'lang',v},'*')}catch(e){}break;
 case 'restart':S.sess=null;S.hist=SEED.map((h,i)=>({...h,id:i}));S.fav=['brk'];S.scr='intro';S.stack=[];render(true);break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;act(el.dataset.a,el.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.focusQ=1;const ql=S.q.trim().toLowerCase();const list=SP.filter(s=>(!ql||s.n.toLowerCase().includes(ql))&&(S.flt==='all'||(S.flt==='fav'&&S.fav.includes(s.id))||(S.flt==='cov'&&s.cov)||(S.flt==='ev'&&s.ev))).sort((a,b)=>a.d-b.d);$('#res').innerHTML=list.map(spotRow).join('')||`<p class="mut">${T('none')}</p>`}});
addEventListener('message',e=>{const d=e.data||{};if(d.mr==='go'){const m=d.v;if(m==='checkin'||m==='session'&&!S.sess){S.spot=S.spot||'brk'}if(['session','extend','checkout'].includes(m)&&!S.sess)S.sess={s:S.spot,bay:S.bay,t0:Date.now()-18*60*1000,ext:0};S.stack=[];if(m==='trip'){S.prog=.15}S.scr=SC[m]?m:'home';render(true)}
 if(d.mr==='lang'&&L[d.v]){S.lang=d.v;render(false)}});
function tick(){const el=$('#clock');if(el)el.textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:false,timeZone:'America/New_York'}).format(new Date())}tick();setInterval(tick,30000);
if(q.get('veh')&&VEH[q.get('veh')])S.veh=q.get('veh');if(q.get('spot')&&spot(q.get('spot'))){S.spot=q.get('spot');S.bay=spot(S.spot).bays[0]}
const s0=q.get('screen');
if(s0&&SC[s0]){if(['session','extend','checkout'].includes(s0))S.sess={s:S.spot,bay:S.bay,t0:Date.now()-18*60*1000,ext:0};if(s0==='trip')S.prog=.3;if(q.get('rc'))S.rc=+q.get('rc');S.scr=s0}
if(q.get('q'))S.q=q.get('q');if(q.get('flt'))S.flt=q.get('flt');if(q.get('range'))S.range=q.get('range');if(q.get('mode'))S.mode=q.get('mode');
render(true);
</script>
