:root{
  --bg:#0F0724;--s1:#1A0F3A;--s2:#25164F;--line:rgba(255,255,255,.11);--ink:#FFF6FB;--mut:#BBABDD;--dim:#8474AD;
  --pink:#FF2E97;--orange:#FF8A3D;--cyan:#1BE7FF;--teal:#00E5C3;--violet:#8B5CFF;--yellow:#FFD23F;--err:#FF6B81;
  --sunset:linear-gradient(135deg,#FF2E97,#FF8A3D);--ocean:linear-gradient(135deg,#1BE7FF,#8B5CFF);--dusk:linear-gradient(160deg,#3B1A7A,#B4237F 60%,#FF7A3D)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--ink);font:400 15px/1.3 Outfit,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}.script{font-family:Yellowtail,cursive;font-weight:400}
.phone{position:fixed;inset:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.status,.home{display:none}
@media(min-width:560px){
  body:not(.embed):not(.bare){display:flex;align-items:center;justify-content:center;background:radial-gradient(800px 500px at 20% 100%,#FF2E97 0,transparent 60%),radial-gradient(900px 600px at 85% 0,#1BE7FF 0,transparent 55%),#0F0724}
  body:not(.embed):not(.bare) .phone{position:relative;inset:auto;width:390px;height:min(844px,calc(100vh - 32px));border-radius:48px;box-shadow:0 0 0 10px #090314,0 0 0 11px #4A2C8F,0 0 60px rgba(255,46,151,.35)}
  body:not(.embed):not(.bare) .status{display:flex}body:not(.embed):not(.bare) .home{display:block}
  body:not(.embed):not(.bare) .phone{--st:38px;--hb:14px}
}
body.bare .status{display:flex}body.bare .home{display:block}body.bare .phone{--st:38px;--hb:14px}
.status{position:absolute;top:0;left:0;right:0;z-index:30;height:44px;justify-content:space-between;align-items:center;padding:6px 27px 0;font-weight:600;font-size:15px;pointer-events:none}
.home{position:absolute;left:50%;bottom:8px;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#fff;opacity:.85;z-index:60;pointer-events:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:var(--st,0px);animation:fade .25s ease both}
.view.full{padding-top:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
.hd{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
.hd .bk{width:42px;height:42px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.hd .tt{font-weight:600;font-size:17px;flex:1}
.body{flex:1;min-height:0;overflow:auto;padding:8px 20px 20px;-webkit-overflow-scrolling:touch}
.foot{padding:12px 20px calc(18px + var(--hb,0px));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,var(--bg) 30%)}
.neon{font-weight:800;font-size:31px;line-height:1.08;letter-spacing:-.01em;margin:10px 0 6px;text-shadow:0 0 22px rgba(255,46,151,.55)}
.sub{color:var(--mut);margin:0 0 16px;font-size:15px;line-height:1.4}
h3{margin:18px 0 10px;font-size:16px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:18px;font-weight:700;font-size:16px;background:var(--sunset);color:#fff;box-shadow:0 8px 26px rgba(255,46,151,.35);text-align:center;width:100%}
.btn:active{transform:scale(.98)}.btn.ghost{background:transparent;border:1.5px solid rgba(27,231,255,.55);color:var(--cyan);box-shadow:none}
.btn.txt{background:none;box-shadow:none;color:var(--cyan);min-height:40px}.btn[disabled]{opacity:.45;box-shadow:none}

pay:()=>({html:`${hdr(T('pyN'))}<div class="body"><div class="neon">${T('pyT')}</div><p class="sub">${T('pyS')}</p><div class="pay"><div class="row sp">${ic('card')}<b>VISA</b></div><div class="n num">•••• •••• •••• 2354</div><div class="row sp sm"><b>MARIA SNOW</b><b>08/29</b></div></div><div style="height:14px"></div><div class="field"><label>${T('country')}</label><div>${T('us')}</div></div><div class="field"><label>${T('city')}</label><div>Miami, FL</div></div>${note('shield',T('pyNote'))}</div>${foot(btn(T('pyC'),'go','vtype'))}`}),

vehicle:()=>({html:`${hdr(T('mvN'))}<div class="body"><div class="neon">${T('mvT')}</div><p class="sub">${T('mvS')}</p><div class="hero" style="min-height:210px;background-image:var(--ph-${VP[S.veh]})"></div><div class="card" style="margin-top:14px"><div class="row sp"><div class="row">${ic('car')}<b style="font-size:19px">${T(S.veh)}</b></div><span class="chip ok">${T('active')}</span></div><p class="mut" style="margin:6px 0 0 34px">PGO-182</p></div><button class="btn txt" data-a="go" data-v="vtype" style="margin-top:8px">${T('chgV')}</button></div>${foot(btn(T('findP'),'start'))}`}),
home:()=>{const c=SP.slice().sort((a,b)=>a.d-b.d)[0];return {tab:'home',full:1,html:`${logo(`<span class="chip">${T('tag')}</span>`)}<div class="body"><div class="neon" style="font-size:28px;margin-top:2px">${T('fpT')}</div><button class="search" data-a="go" data-v="search" style="width:100%">${ic('search')}<span class="dim">${T('searchPh')}</span></button>${S.sess?`<button class="turn" data-a="go" data-v="session" style="background:var(--ocean)"><span class="ico" style="background:rgba(15,7,36,.25);color:#fff">${ic('clock')}</span><span style="flex:1"><b style="display:block;color:#0F0724">${T('live')}</b><span class="num" style="color:#0F0724;font-weight:700" data-live>${mmss(left())}</span></span>${ic('chev')}</button>`:''}${mapSvg({pins:1})}<h3>${T('closest')}</h3>${spotRow(c)}<button class="btn txt" data-a="go" data-v="search">${t('seeAll',SP.length)}</button></div>${tabs('home')}`}},
search:()=>{const ql=S.q.trim().toLowerCase();const list=SP.filter(s=>(!ql||s.n.toLowerCase().includes(ql))&&(S.flt==='all'||(S.flt==='fav'&&S.fav.includes(s.id))||(S.flt==='cov'&&s.cov)||(S.flt==='ev'&&s.ev))).sort((a,b)=>a.d-b.d);
 return {html:`${hdr(T('srN'))}<div class="body"><div class="neon">${T('srT')}</div><p class="sub">${t('srS',SP.length)}</p><label class="search">${ic('search')}<input id="q" value="${S.q.replace(/"/g,'&quot;')}" placeholder="${T('searchPh')}" aria-label="${T('searchPh')}" autocomplete="off"></label><div class="chips">${[['all','fAll'],['fav','fFav'],['cov','fCov'],['ev','fEv']].map(([k,l])=>`<button class="fc" data-a="flt" data-v="${k}" aria-pressed="${S.flt===k}">${T(l)}</button>`).join('')}</div>${mapSvg({pins:1})}<h3>${T('avail')}</h3><div class="list" id="res">${list.map(spotRow).join('')||`<p class="mut">${T('none')}</p>`}</div></div>`}},
spot:()=>{const s=spot(S.spot),open=isOpen(s);return {html:`${hdr(T('sdN'))}<div class="body"><div class="hero" style="background-image:var(--ph-${s.ph});min-height:210px"></div><div class="row sp" style="margin-top:14px"><span class="chip ${open?'ok':'pk'}">${open?T('openD'):T('closedD')}</span><button class="heart ${S.fav.includes(s.id)?'on':''}" data-a="fav" data-v="${s.id}" aria-label="Favorite" aria-pressed="${S.fav.includes(s.id)}">${ic('heart')}</button></div><div class="neon" style="font-size:27px;margin-top:6px">${s.n}</div><div class="row sp"><span class="mut">${t('away',s.d)} · ${t('bays',s.free)}</span><span class="price" style="font-size:18px">${money(s.r)} ${t('hr')}</span></div><div class="card" style="margin-top:16px"><b>${T('incl')}</b><div class="col" style="margin-top:10px;gap:8px"><span class="row">${ic('check')}${T('i1')}</span><span class="row">${ic('check')}${T('i2')}</span>${s.cov?`<span class="row">${ic('roof')}${T('iCov')}</span>`:''}${s.ev?`<span class="row">${ic('bolt')}${T('iEv')}</span>`:''}<span class="row">${ic('clock')}${hoursTxt(s)}</span></div></div></div>${foot(btn(T('chooseBay'),'bays'))}`}},
bay:()=>{const s=spot(S.spot);return {html:`${hdr(T('bayN'))}<div class="body"><div class="neon">${T('bayT')}</div><p class="sub">${T('bayS')}</p><div class="item"><span class="ico">${ic('p')}</span><span class="g"><b>${s.n}</b><span class="price">${money(s.r)} ${t('hr')}</span></span></div><div class="grid2" style="margin:14px 0">${s.bays.map((b,i)=>`<button class="opt" data-a="pickbay" data-v="${b}" aria-pressed="${S.bay===b}" ${i===3&&s.bays.length>4?'disabled':''}>${b}<small>${i===3&&s.bays.length>4?T('taken'):T('avl')}</small></button>`).join('')}</div><div class="card"><div class="kv"><span>${T('selBay')}</span><b>${S.bay}</b></div><div class="kv"><span>${T('sub')}</span><b>${money(s.r)}</b></div></div><div style="height:12px"></div>${note('clock',T('bayNote'))}</div>${foot(btn(T('reserve'),'reserve'))}`}},

activity:()=>{const today=S.hist.filter(h=>h.d===0);const rest=S.hist.filter(h=>h.d>0).slice(0,3);const row=h=>{const s=spot(h.s);return `<button class="item" data-a="rc" data-v="${h.id}"><span class="ico">${ic('receipt')}</span><span class="g"><b>${s.n}</b><span class="sm mut">${rel(h.d)} · ${h.m} ${T('min')}</span></span><b class="num">${money(h.a)}</b></button>`};
 return {tab:'activity',full:1,html:`<div class="body" style="padding-top:calc(var(--st,0px) + 14px)"><div class="neon">${T('acT')}</div><p class="sub">${T('acS')}</p>${S.sess?`<button class="turn" data-a="go" data-v="session" style="background:var(--ocean)"><span class="ico" style="background:rgba(15,7,36,.25);color:#fff">${ic('clock')}</span><span style="flex:1"><b style="display:block;color:#0F0724">${T('live')}</b><span class="sm" style="color:#0F0724">${T('liveS')}</span></span><span class="num b" style="color:#0F0724" data-live>${mmss(left())}</span></button>`:''}<button class="dark" data-a="go" data-v="stats" style="width:100%;display:block"><div class="k">${T('pat')}</div><div class="big" style="font-size:24px">${T('seePat')}</div><div class="row b" style="color:var(--cyan);margin-top:10px">${T('viewSt')} ${ic('chev')}</div></button><h3>${T('recent')}</h3><div class="list">${today.length?today.map(row).join(''):`<div class="item" style="color:var(--mut)">${ic('receipt')}<span>${T('noToday')}</span></div>`}${rest.map(row).join('')}</div><div style="height:14px"></div>${note('card',T('acNote'))}</div>${tabs('activity')}`}},
receipt:()=>{const h=S.hist.find(x=>x.id===S.rc)||S.hist[0],s=spot(h.s);return {html:`${hdr(T('rcN'))}<div class="body"><div class="neon">${T('rcT')}</div><p class="sub">${s.n}</p><div class="card"><div class="kv"><span>${T('ref')}</span><b class="num">PG-${String(1000+h.id*37).slice(-4)}</b></div><div class="kv"><span>${T('date')}</span><b>${rel(h.d)}</b></div><div class="kv"><span>${T('bay')}</span><b>${s.bays[h.id%s.bays.length]}</b></div><div class="kv"><span>${T('plate')}</span><b>PGO-182</b></div><div class="kv"><span>${T('dur')}</span><b>${h.m} ${T('min')}</b></div><div class="kv"><span>${T('status')}</span><span class="chip ok">${T('done')}</span></div><div class="kv"><span>${T('total')}</span><b class="price" style="font-size:19px">${money(h.a)}</b></div></div></div>`}},
stats:()=>{const R=S.range,H=S.hist;let items,rows;
 if(R==='today'){items=H.filter(h=>h.d===0);rows=items.map(h=>[spot(h.s).n.split(' ')[0],h.a,h.m]);}
 else if(R==='week'){const lab=[];rows=[];for(let i=6;i>=0;i--){const dt=new Date(Date.now()-i*864e5);const day=new Date(dt.toLocaleString('en-US',{timeZone:'America/New_York'})).getDay();const hs=H.filter(h=>h.d===i);rows.push([t('stB')[day],hs.reduce((a,h)=>a+h.a,0),hs.reduce((a,h)=>a+h.m,0)])}items=H.filter(h=>h.d<7)}
 else{rows=[];for(let w=3;w>=0;w--){const hs=H.filter(h=>h.d>=w*7&&h.d<w*7+7);rows.push([t('wk',4-w),hs.reduce((a,h)=>a+h.a,0),hs.reduce((a,h)=>a+h.m,0)])}items=H.filter(h=>h.d<28)}
 const sp=items.reduce((a,h)=>a+h.a,0),mn=items.reduce((a,h)=>a+h.m,0),mx=Math.max(1,...rows.map(r=>r[1])),hiI=rows.reduce((b,r,i)=>r[1]>rows[b][1]?i:b,0);
 const lbl={today:'today',week:'week',month:'month'}[R];
 return {html:`${hdr(T('stN'))}<div class="body"><div class="neon">${T('stT')}</div><p class="sub">${T('stS')}</p><div class="seg" role="group">${['today','week','month'].map(k=>`<button data-a="range" data-v="${k}" aria-pressed="${R===k}">${T(k)}</button>`).join('')}</div><div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:10px">${[[items.length,'visits'],[money(sp),'spent'],[mn>=60?`${(mn/60).toFixed(1)} h`:`${mn} ${T('min')}`,'parked']].map(([v,l])=>`<div class="card" style="padding:12px 10px"><b class="num" style="font-size:19px;display:block">${v}</b><span class="sm mut">${T(l)}</span></div>`).join('')}</div><div class="seg" style="margin:14px 0 10px">${[['chart','chart'],['table','table']].map(([k,i])=>`<button data-a="mode" data-v="${k}" aria-pressed="${S.mode===k}"><span class="row" style="justify-content:center;gap:6px">${ic(i)}${T(k)}</span></button>`).join('')}</div><div class="card"><b>${T('spend')}</b>${S.mode==='chart'?`<div class="bars" role="img" aria-label="${T('spend')}">${rows.map((r,i)=>`<div class="${i===hiI&&r[1]>0?'hi':''}"><i style="height:${Math.max(3,r[1]/mx*100)}%"></i><span>${r[0]}</span></div>`).join('')||`<p class="mut">—</p>`}</div>`:`<div style="margin-top:6px">${rows.map(r=>`<div class="kv"><span>${r[0]}</span><span class="num">${r[2]} ${T('min')} · <b style="color:var(--ink)">${money(r[1])}</b></span></div>`).join('')||`<p class="mut">—</p>`}</div>`}</div></div>${foot(btn(T('back'),'tab','activity','txt'))}`}},
profile:()=>({tab:'profile',full:1,html:`<div class="body" style="padding-top:calc(var(--st,0px) + 14px)"><div class="row" style="gap:16px"><div class="avatar" role="img" aria-label="Maria Snow"></div><div><div class="neon" style="font-size:28px;margin:0">Maria Snow</div><div class="mut">${T('prSub')}</div></div></div><div class="list" style="margin-top:20px"><button class="item" data-a="go" data-v="vehicle"><span class="ico">${ic('car')}</span><span class="g"><b>${T('prV')}</b><span class="sm mut">${T('prVs')}</span></span>${ic('chev')}</button><button class="item" data-a="go" data-v="pay"><span class="ico">${ic('card')}</span><span class="g"><b>${T('prP')}</b><span class="sm mut">${T('prPs')}</span></span>${ic('chev')}</button><button class="item" data-a="go" data-v="stats"><span class="ico">${ic('chart')}</span><span class="g"><b>${T('prS')}</b><span class="sm mut">${T('prSs')}</span></span>${ic('chev')}</button><button class="item" data-a="go" data-v="search"><span class="ico pk">${ic('heart')}</span><span class="g"><b>${T('prF')}</b><span class="sm mut">${t('prFs',S.fav.length)}</span></span>${ic('chev')}</button></div><h3>${T('lang')}</h3><div class="lg">${['en','es','pt'].map(k=>`<button data-a="lang" data-v="${k}" aria-pressed="${S.lang===k}">${k.toUpperCase()}</button>`).join('')}</div><button class="btn txt" data-a="restart" style="margin-top:14px">${T('signOut')}</button><p class="sm dim" style="text-align:center">${T('ph')}</p></div>${tabs('profile')}`})
};
/* ---------- render ---------- */
let timer;
function render(anim=true){
 document.documentElement.lang=S.lang;clearInterval(timer);
 const sc=view.querySelector('.body'),pos=sc?sc.scrollTop:0,f=SC[S.scr]();
 view.className='view'+(f.full?' full':'');if(!anim)view.style.animation='none';else view.style.animation='';
 view.innerHTML=f.html;const b=view.querySelector('.body');if(b&&!anim)b.scrollTop=pos;
 const qi=$('#q');if(qi&&S.focusQ){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
 document.title=`Parkin’go · ${S.scr}`;
 if(S.scr==='trip'){timer=setInterval(()=>{S.prog=Math.min(1,S.prog+.02);const s=spot(S.spot);const tm=$('#tmap');if(tm)tm.innerHTML=mapSvg({route:s.id,p:S.prog});const pb=$('#pbar');if(pb)pb.style.width=S.prog*100+'%';const e=$('#etaT');if(e)e.textContent=eta(Math.max(1,Math.round(mins(s)*(1-S.prog))));if(S.prog>=1)clearInterval(timer)},400)}
 if(S.sess)timer=timer||setInterval(()=>{},1e9);
 if(S.sess&&S.scr!=='trip'){clearInterval(timer);timer=setInterval(()=>{document.querySelectorAll('[data-live]').forEach(e=>e.textContent=mmss(left()));const lb=$('#lbar');if(lb)lb.style.width=(100-left()/LIVE_DUR()*100)+'%'},1000)}
 try{parent.postMessage({mr:'screen',v:S.scr},'*')}catch(e){}
}
const TABS=['home','activity','profile'];
function go(s){if(!SC[s])return;if(TABS.includes(S.scr)||s===S.scr){}else S.stack.push(S.scr);if(TABS.includes(s))S.stack=[];S.scr=s;if(s==='trip'&&S.prog>=1)S.prog=0;render(true)}
function toast(m){const old=$('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;$('#phone').appendChild(d);setTimeout(()=>d.remove(),1900)}
function act(a,v){switch(a){
 case 'go':go(v);break;
 case 'back':S.scr=S.stack.pop()||'home';render(true);break;
 case 'tab':S.stack=[];S.scr=v;render(true);break;
 case 'start':S.stack=[];S.scr='home';render(true);break;
 case 'veh':S.veh=v;render(false);break;
 case 'spot':S.spot=v;S.bay=spot(v).bays[0];S.ext=0;S.stack=S.scr==='spot'?S.stack:[...S.stack,S.scr];S.scr='spot';render(true);break;
 case 'fav':{const i=S.fav.indexOf(v);i<0?S.fav.push(v):S.fav.splice(i,1);render(false);toast(i<0?t('faved'):t('unfaved'));break}
 case 'flt':S.flt=v;S.focusQ=0;render(false);break;
 case 'bays':if(!isOpen(spot(S.spot)))return toast(t('isClosed'));go('bay');break;
 case 'pickbay':S.bay=v;render(false);break;
 case 'reserve':S.prog=0;S.step=0;go('route');break;
 case 'step':S.step++;render(false);break;
 case 'checkin':{S.sess={s:S.spot,bay:S.bay,t0:Date.now(),ext:0};S.rate=0;S.scr='session';S.stack=[];render(true);break}
 case 'add':S.add=+v;render(false);break;
 case 'extend':if(S.sess)S.sess.ext+=S.add;S.scr='session';S.stack=[];render(true);toast(t('exDone'));break;
 case 'rate':S.rate=+v;render(false);break;
 case 'end':{if(S.sess){const s=spot(S.sess.s),m=60+S.sess.ext;S.hist.unshift({id:S.hist.length+10,s:S.sess.s,d:0,m,a:s.r*m/60});S.sess=null}S.scr='done';S.stack=[];render(true);break}
 case 'rc':S.rc=+v;go('receipt');break;
 case 'range':S.range=v;render(false);break;
 case 'mode':S.mode=v;render(false);break;
 case 'lang':S.lang=v;render(false);try{parent.postMessage({mr:'lang',v},'*')}catch(e){}break;
 case 'restart':S.sess=null;S.hist=SEED.map((h,i)=>({...h,id:i}));S.fav=['brk'];S.scr='intro';S.stack=[];render(true);break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;act(el.dataset.a,el.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.focusQ=1;const ql=S.q.trim().toLowerCase();const list=SP.filter(s=>(!ql||s.n.toLowerCase().includes(ql))&&(S.flt==='all'||(S.flt==='fav'&&S.fav.includes(s.id))||(S.flt==='cov'&&s.cov)||(S.flt==='ev'&&s.ev))).sort((a,b)=>a.d-b.d);$('#res').innerHTML=list.map(spotRow).join('')||`<p class="mut">${T('none')}</p>`}});
addEventListener('message',e=>{const d=e.data||{};if(d.mr==='go'){const m=d.v;if(m==='checkin'||m==='session'&&!S.sess){S.spot=S.spot||'brk'}if(['session','extend','checkout'].includes(m)&&!S.sess)S.sess={s:S.spot,bay:S.bay,t0:Date.now()-18*60*1000,ext:0};S.stack=[];if(m==='trip'){S.prog=.15}S.scr=SC[m]?m:'home';render(true)}
 if(d.mr==='lang'&&L[d.v]){S.lang=d.v;render(false)}});
function tick(){const el=$('#clock');if(el)el.textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:false,timeZone:'America/New_York'}).format(new Date())}tick();setInterval(tick,30000);
if(q.get('veh')&&VEH[q.get('veh')])S.veh=q.get('veh');if(q.get('spot')&&spot(q.get('spot'))){S.spot=q.get('spot');S.bay=spot(S.spot).bays[0]}
const s0=q.get('screen');
if(s0&&SC[s0]){if(['session','extend','checkout'].includes(s0))S.sess={s:S.spot,bay:S.bay,t0:Date.now()-18*60*1000,ext:0};if(s0==='trip')S.prog=.3;if(q.get('rc'))S.rc=+q.get('rc');S.scr=s0}
if(q.get('q'))S.q=q.get('q');if(q.get('flt'))S.flt=q.get('flt');if(q.get('range'))S.range=q.get('range');if(q.get('mode'))S.mode=q.get('mode');
render(true);
</script>
</body>
</html>
